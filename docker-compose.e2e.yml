services:
  appium:
    image: appium/appium:latest
    container_name: genova-appium
    ports:
      - "4723:4723"
    environment:
      - ANDROID_ADB_SERVER_ADDRESS=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/build/outputs/apk/debug:/apk:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4723/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

  e2e-runner:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    depends_on:
      appium:
        condition: service_healthy
    environment:
      - APPIUM_SERVER_URL=http://appium:4723
      - APP_PACKAGE=com.genova.musicplayer
      - APP_ACTIVITY=com.genova.musicplayer.ui.LibraryActivity
      - ANDROID_ADB_SERVER_ADDRESS=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037
    volumes:
      - ./e2e:/e2e
